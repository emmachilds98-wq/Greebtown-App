name: Deploy Firebase (Cloud Functions + Firestore rules)

# Only runs when something that actually needs deploying changes — a
# regular app.js/index.html edit never triggers this, only the backend
# pieces (Cloud Function source, firestore.rules, or the Firebase config
# files themselves). Also runnable by hand from the Actions tab.
on:
  push:
    branches: [emmachilds98-wq-patch-2]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function dependencies
        run: npm install --prefix functions

      # Authenticates as the service account behind the
      # FIREBASE_SERVICE_ACCOUNT secret (its JSON key, generated in
      # Firebase Console → Project settings → Service accounts →
      # Generate new private key) — the Firebase CLI picks this up
      # automatically via GOOGLE_APPLICATION_CREDENTIALS, no separate
      # `firebase login` step needed.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Split into two independent steps (was one combined
      # `--only functions,firestore:rules` command). This CI service
      # account (FIREBASE_SERVICE_ACCOUNT) has repeatedly failed on
      # Functions specifically with "Missing permissions... you must
      # have iam.serviceAccounts.ActAs on greebtown@appspot.gserviceaccount.com"
      # — a manual `firebase deploy` from a developer's own logged-in
      # Google account works fine (different identity, already has
      # broad project rights), which is NOT the same as this CI service
      # account having that specific IAM grant. Firestore rules deploy
      # needs no such permission, so it's split out and required (job
      # fails loudly if it breaks); Functions is allowed to fail on its
      # own without blocking rules, until iam.serviceAccounts.ActAs on
      # that app-engine default service account is actually granted to
      # THIS CI service account (not a developer's personal account) at
      # https://console.cloud.google.com/iam-admin/iam?project=greebtown
      # — still visible as a failed/red step here, just not blocking.
      # --force auto-accepts the Artifact Registry cleanup-policy prompt
      # the Functions deploy would otherwise ask about interactively
      # (not possible in --non-interactive CI) — cosmetic only, about
      # lifecycle rules for old container build images.
      - name: Deploy Firestore rules
        run: npx firebase-tools@13 deploy --only firestore:rules --project greebtown --non-interactive

      - name: Deploy Cloud Functions
        continue-on-error: true
        run: npx firebase-tools@13 deploy --only functions --project greebtown --non-interactive --force
