name: Sync Boomtown lineup

on:
  workflow_dispatch: {}
  schedule:
    # Daily baseline, all year round.
    - cron: "17 6 * * *"
    # Hourly attempt — the job below skips itself outside festival week
    # (2026-08-12 to 2026-08-16 inclusive, UK local dates) so this doesn't
    # spam commits the rest of the year.
    - cron: "5 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Skip hourly run outside festival week
        if: github.event.schedule == '5 * * * *'
        env:
          TZ: Europe/London
        run: |
          today=$(date +%Y-%m-%d)
          if [[ "$today" < "2026-08-12" || "$today" > "2026-08-16" ]]; then
            echo "Not festival week ($today) — skipping hourly run."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != 'true'
        with:
          ref: emmachilds98-wq-patch-2

      - uses: actions/setup-node@v4
        if: env.SKIP != 'true'
        with:
          node-version: "22"

      - name: Fetch latest lineup and regenerate js/app.js
        if: env.SKIP != 'true'
        env:
          CLASHFINDER_USERNAME: ${{ secrets.CLASHFINDER_USERNAME }}
          CLASHFINDER_PRIVATE_KEY: ${{ secrets.CLASHFINDER_PRIVATE_KEY }}
          CLASHFINDER_SLUG: ${{ vars.CLASHFINDER_SLUG }}
        run: node scripts/sync-boomtown-lineup.mjs

      - name: Commit and push if changed
        if: env.SKIP != 'true'
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "boomtown-lineup-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add js/app.js service-worker.js
          git commit -m "Auto-sync Boomtown lineup from Clashfinder"
          git push origin HEAD:emmachilds98-wq-patch-2
